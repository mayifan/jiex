version: '3.8'

services:
  jiex-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiex-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
